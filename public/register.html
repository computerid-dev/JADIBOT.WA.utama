<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar — JADI BOT WA</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-mark">JB</div>
      JADI BOT WA
    </div>
    <h1>Bikin akun</h1>
    <p class="sub">Akun lo bakal ditinjau admin dulu sebelum bisa dipakai.</p>

    <div class="alert" id="alert"></div>

    <form id="form-register">
      <div class="field">
        <label for="nama">Nama</label>
        <input type="text" id="nama" required placeholder="Nama lengkap lo">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="email@kamu.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Minimal 6 karakter">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="btn-submit">Daftar</button>
    </form>

    <p class="auth-footer">Udah punya akun? <a href="/masuk" style="font-weight:700">Masuk di sini</a></p>
  </div>
</div>

<script>
const form = document.getElementById('form-register');
const alertBox = document.getElementById('alert');
const btn = document.getElementById('btn-submit');

function showAlert(msg, type) {
  alertBox.textContent = msg;
  alertBox.className = 'alert show ' + type;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true;
  btn.textContent = 'Memproses...';

  const nama = document.getElementById('nama').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nama, email, password })
    });
    const data = await res.json();

    if (!res.ok) {
      showAlert(data.error || 'Gagal daftar', 'err');
      btn.disabled = false;
      btn.textContent = 'Daftar';
      return;
    }

    showAlert(data.message, 'ok');
    form.reset();
    btn.textContent = 'Berhasil ✓';
  } catch (err) {
    showAlert('Gagal konek ke server, coba lagi', 'err');
    btn.disabled = false;
    btn.textContent = 'Daftar';
  }
});
</script>

</body>
</html>
